services:
  - type: web
    name: twobee-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_MODE
        value: postgres
      - key: GEO_BACKEND
        value: auto
      - key: H3_RESOLUTION
        value: "6"
      - key: REDIS_URL
        sync: false
      - key: MAPS_PROVIDER
        value: osm
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: PAYMENT_MODE
        value: stripe_sandbox
      - key: SMS_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false # Set to Supabase Session Pooler URI (IPv4) in Render Dashboard Environment Variables
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ROLE_SECRET
        generateValue: true
      - key: SIGNED_URL_SECRET
        generateValue: true
      - key: FCM_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: 2bee-media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_SEED_EMAIL
        value: admin@2bee.app
      - key: ADMIN_SEED_PASSWORD
        value: 123456
        sync: false
